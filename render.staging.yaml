services:
  - type: web
    name: titi-backend-staging
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npx prisma generate
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RAG_ENABLED
        value: "true"
      - key: RAG_COURSE_IDS
        value: "*"
      - key: RAG_ALLOWED_USER_EMAIL
        value: student@gmail.com
      - key: EMBEDDING_API_URL
        sync: false
      - key: EMBEDDING_API_KEY
        fromService:
          type: web
          name: titi-embedding-staging
          envVarKey: EMBEDDING_API_KEY
      - key: EMBEDDING_MODEL
        value: google/embeddinggemma-300M
      - key: EMBEDDING_DIMENSIONS
        value: "768"
      - key: EMBEDDING_PROVIDER
        value: local
      - key: EMBEDDING_TIMEOUT_MS
        value: "120000"
      - key: EMBEDDING_MAX_RETRIES
        value: "1"
      - key: RAG_CHAT_MODE
        value: gateway
      - key: RAG_CHAT_RATE_LIMIT_PER_MINUTE
        value: "5"
      - key: RAG_CHAT_DAILY_QUOTA
        value: "30"
      - key: RAG_CHAT_TIMEOUT_MS
        value: "30000"
      - key: RAG_PRINCIPAL_SALT
        generateValue: true
      - key: AI_GATEWAY_URL
        sync: false
      - key: AI_GATEWAY_TOKEN
        fromService:
          type: web
          name: titi-ai-gateway-staging
          envVarKey: AI_GATEWAY_TOKEN

  - type: web
    name: titi-ai-gateway-staging
    runtime: node
    plan: free
    rootDir: ai-gateway
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: AI_GATEWAY_TOKEN
        generateValue: true
      - key: AI_GATEWAY_USER_SALT
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: GROQ_API_URL
        value: https://api.groq.com/openai/v1/chat/completions
      - key: AI_GATEWAY_RATE_LIMIT_PER_MINUTE
        value: "5"
      - key: AI_GATEWAY_DAILY_QUOTA
        value: "30"
      - key: AI_GATEWAY_MAX_CONCURRENCY
        value: "2"
      - key: AI_GATEWAY_TIMEOUT_MS
        value: "30000"
      - key: AI_GATEWAY_STATE_STORE
        value: memory

  - type: web
    name: titi-embedding-staging
    runtime: python
    plan: starter
    rootDir: embedding-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: HF_TOKEN
        sync: false
      - key: EMBEDDING_API_KEY
        generateValue: true
      - key: EMBEDDING_MODEL
        value: google/embeddinggemma-300M
