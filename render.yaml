services:
  - type: web
    name: titi-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npx prisma generate
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /api/health
    # Producción: despliegue manual después de los gates del runbook RAG.
    autoDeploy: false
    envVars:
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PORT
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RAG_ENABLED
        value: "true"
      - key: RAG_CHAT_ENABLED
        value: "false"
      - key: RAG_COURSE_IDS
        value: bceba93d-d954-4bc9-abf7-db865b1df8ff
      - key: RAG_AUDIENCE_MODE
        value: canary
      - key: RAG_ALLOWED_USER_EMAIL
        sync: false
      - key: RAG_CREDENTIAL_MODE
        value: user_required
      # Nombre de versión activa y material AES-256-GCM; valores reales solo en Render.
      - key: AI_CREDENTIAL_KEY_CURRENT
        sync: false
      - key: AI_CREDENTIAL_KEY_V1
        sync: false
      - key: EMBEDDING_API_URL
        sync: false
      - key: EMBEDDING_API_KEY
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_AI_API_TOKEN
        sync: false
      - key: EMBEDDING_MODEL
        value: '@cf/google/embeddinggemma-300m'
      - key: EMBEDDING_DIMENSIONS
        value: "768"
      - key: EMBEDDING_PROVIDER
        value: cloudflare
      - key: EMBEDDING_TIMEOUT_MS
        value: "120000"
      - key: EMBEDDING_MAX_RETRIES
        value: "1"
      - key: AI_PROVIDER_ROUTE
        value: cloudflare_gateway
      - key: CLOUDFLARE_AI_GATEWAY_ID
        sync: false
      - key: CLOUDFLARE_AI_GATEWAY_TOKEN
        sync: false
      - key: RAG_CHAT_RATE_LIMIT_PER_MINUTE
        value: "5"
      - key: RAG_CHAT_DAILY_QUOTA
        value: "30"
      - key: RAG_CHAT_TIMEOUT_MS
        value: "30000"
      - key: RAG_PRINCIPAL_SALT
        sync: false
