schema: spec-driven

context: |
  Proyecto: Titi (red social educativa boliviana). Dual-DB: Neo4j (social) +
  PostgreSQL/Prisma (educativo + gamificación), ligadas por Usuario.neoId.
  Frontend React 18 + Vite + Tailwind 3. Backend Node 20 + Express 5 + JWT.
  Ids: crypto.randomUUID() en Neo4j, @default(uuid()) en Prisma.
  Idiomas: código en inglés, specs/docs/UI en español.

rules:
  proposal:
    - Máx ~1 página. Intención, alcance in/out, criterios de éxito.
    - Incluir decisiones de arrastre relevantes si tocan sistemas existentes.
  specs:
    - Requisitos en español claro y funcional (qué, no cómo).
    - Cubrir casos borde: sin datos, sin permisos, fallos de servicios externos.
    - Respetar regla de oro: servicios externos/gamificación nunca bloquean la operación principal.
  design:
    - Solo si el change toca arquitectura (dual-DB, sync, economía). Citar
      docs/architecture.md y skills titi-dual-db.
  tasks:
    - Unidades commitables: backend → frontend → tests → docs.
    - Cada unidad verificable con el comando indicado (test/build/lint).
  apply:
    guidelines:
      - Seguir titi-backend-patterns / titi-frontend-patterns / titi-dual-db.
      - UI plana: sin bg-gradient-* ni blur-*. Mascota siempre <TitiMascot>.
      - Respuesta API: { success, data } | { success: false, message } (español).
      - Commits: conventional en español, identidad abdair-coca, sin Co-Authored-By.
    tdd: false
    test_command: "cd backend && npm test"
  verify:
    test_command: "cd backend && npm test"
    build_command: "cd frontend && npm run build"
    coverage_threshold: 0
  archive:
    - Archive es inmutable (audit trail). No modificar cambios archivados.